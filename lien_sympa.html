<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonnement Liste ahm_paris</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #0056b3;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0056b3;
            outline: none;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #0056b3;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>S'abonner à ahm_paris</h1>
    <p>Remplissez vos informations ci-dessous pour générer automatiquement votre e-mail d'abonnement au serveur du CNRS.</p>
    
    <div class="input-group">
        <label for="firstname">Prénom</label>
        <input type="text" id="firstname" placeholder="Ex : Marie" oninput="updateLink()">
    </div>
    
    <div class="input-group">
        <label for="lastname">Nom</label>
        <input type="text" id="lastname" placeholder="Ex : Dupont" oninput="updateLink()">
    </div>
    
    <a id="mail-link" href="mailto:sympa@listes.math.cnrs.fr?subject=subscribe%20ahm_paris" class="btn">Générer l'e-mail d'abonnement</a>
</div>

<script>
    function updateLink() {
        const firstname = encodeURIComponent(document.getElementById('firstname').value.trim());
        const lastname = encodeURIComponent(document.getElementById('lastname').value.trim());
        const link = document.getElementById('mail-link');
        
        let subject = "subscribe ahm_paris";
        if (firstname || lastname) {
            subject += " " + (firstname + " " + lastname).trim();
        }
        
        link.href = `mailto:sympa@listes.math.cnrs.fr?subject=${encodeURIComponent(subject)}`;
    }
</script>

</body>
</html>
